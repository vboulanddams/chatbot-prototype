<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Assistant Support Mobile — Prototype</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --bubble-user: #2563eb;
    --bubble-bot: #232733;
    --text: #e8e9ed;
    --muted: #8b8f9a;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .app {
    width: 480px;
    height: 640px;
    background: var(--panel);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .header {
    padding: 16px 20px;
    border-bottom: 1px solid #2a2e38;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .header .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #22c55e;
  }
  .header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 600;
  }
  .header p {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    border-bottom-left-radius: 4px;
  }
  .msg.bot.loading {
    color: var(--muted);
    font-style: italic;
  }
  .inputbar {
    display: flex;
    padding: 14px;
    gap: 8px;
    border-top: 1px solid #2a2e38;
  }
  .inputbar input {
    flex: 1;
    background: #0f1115;
    border: 1px solid #2a2e38;
    border-radius: 10px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  .inputbar input:focus {
    border-color: var(--accent);
  }
  .inputbar button {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  .inputbar button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 20px 14px;
  }
  .suggestions button {
    background: #232733;
    border: 1px solid #2a2e38;
    color: var(--muted);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 20px;
    cursor: pointer;
  }
  .suggestions button:hover {
    border-color: var(--accent);
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="dot"></div>
      <div>
        <h1>Assistant Support Mobile</h1>
        <p>Prototype — LLM-first</p>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="msg bot">Bienvenue chez Dam's, je suis votre agent IA, cet appel est susceptible d'être enregistré pour m'améliorer sauf opposition de votre part, comment puis-je vous aider ?</div>
    </div>
    <div class="suggestions">
      <button onclick="sendSuggestion('J\'ai oublié mon code de déverrouillage sur Android')">Code déverrouillage</button>
      <button onclick="sendSuggestion('J\'ai un souci avec mon code PIN')">Code PIN/PUK</button>
      <button onclick="sendSuggestion('Ma mise à jour système reste bloquée')">MàJ bloquée</button>
      <button onclick="sendSuggestion('Comment sauvegarder mon téléphone ?')">Sauvegarde</button>
      <button onclick="sendSuggestion('Je n\'arrive pas à me connecter au Wi-Fi')">Wi-Fi</button>
      <button onclick="sendSuggestion('J\'ai perdu l\'accès à mon compte Google')">Compte Google/Apple</button>
    </div>
    <div class="inputbar">
      <input id="input" type="text" placeholder="Décrivez votre problème..." onkeydown="if(event.key==='Enter') send()">
      <button id="sendBtn" onclick="send()">Envoyer</button>
    </div>
  </div>

<script>
const sessionId = 'session-' + Math.random().toString(36).slice(2);
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function addMessage(text, sender) {
  const div = document.createElement('div');
  div.className = 'msg ' + sender;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function sendSuggestion(text) {
  inputEl.value = text;
  send();
}

async function send() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, 'user');
  inputEl.value = '';
  sendBtn.disabled = true;

  const loadingEl = addMessage('...', 'bot loading');

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text })
    });
    const data = await res.json();
    loadingEl.remove();
    addMessage(data.reply, 'bot');
  } catch (e) {
    loadingEl.remove();
    addMessage("Erreur de connexion au serveur.", 'bot');
  }
  sendBtn.disabled = false;
}
</script>
</body>
</html>
